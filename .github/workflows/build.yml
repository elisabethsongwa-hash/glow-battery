name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.glow --project-name glow_battery .
      - name: Overlay app files
        run: |
          rm -rf test
          cp app/lib/main.dart lib/main.dart
          K=android/app/src/main/kotlin/com/glow/glow_battery
          mkdir -p $K
          rm -f $K/*.kt
          cp app/android/MainActivity.kt app/android/MonitorService.kt $K/
          cp app/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: glow-battery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Glow Battery v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
